<svg xmlns="http://www.w3.org/2000/svg" width="400" height="60" viewBox="0 0 400 60" role="img" aria-label="Linux Peripheral Controller: button input and LED control for the Linux-Voice-Assistant.">
  <title>Linux Peripheral Controller: button input and LED control for the Linux-Voice-Assistant.</title>
  <defs>
